<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="bg">
      <div class="tictac">
        <div class="scoreboard">
          <div class="board1">Player X</div>
          <div class="board2">Draw</div>
          <div class="board3">Player O</div>
        </div>
        <div class="boxes">
          <div class="box" onclick="addXandO(0)"></div>
          <div class="box" onclick="addXandO(1)"></div>
          <div class="box" onclick="addXandO(2)"></div>
          <div class="box" onclick="addXandO(3)"></div>
          <div class="box" onclick="addXandO(4)"></div>
          <div class="box" onclick="addXandO(5)"></div>
          <div class="box" onclick="addXandO(6)"></div>
          <div class="box" onclick="addXandO(7)"></div>
          <div class="box" onclick="addXandO(8)"></div>
          <div class="status">GAME START</div>
        </div>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
